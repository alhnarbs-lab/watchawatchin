<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WatchaWatchin</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

:root {
  --bg: #0d0d0d;
  --card: rgba(255, 255, 255, 0.03);
  --card-hover: rgba(255, 255, 255, 0.05);
  --border: rgba(255, 255, 255, 0.08);
  --ink: #f0f0f0;
  --mute: #a0a0a0;
  --ac: #E50914; /* Netflix Kırmızısı */
  --ac2: #b20710;
  --ok: #46d369; /* Netflix Eşleşme Yeşili */
  --radius: 16px;
  --font: 'Poppins', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: 
    radial-gradient(circle at 15% 50%, rgba(229, 9, 20, 0.06) 0%, transparent 50%),
    radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
  color: var(--ink);
  font-family: var(--font);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 900px; margin: 0 auto; padding: 0 24px 100px; }

header {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  padding: 32px 0 24px;
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(13, 13, 13, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  margin-bottom: 30px;
}

/* Sabit Logo Stilleri (Mat & Çerçevesiz) */
h1 {
  margin: 0;
  text-transform: uppercase;
  color: var(--ac);
  display: inline-flex;
  align-items: center;
}
.w-logo {
  font-size: 38px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: 0;
}
.logo-rest {
  font-size: 24px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 2px;
  margin-left: 2px;
}
/* Logo Bitiş */

.sp { flex: 1; }

button {
  font-family: var(--font);
  font-weight: 600;
  cursor: pointer;
  border: 0;
  border-radius: 12px;
  padding: 12px 24px;
  color: #fff;
  background: var(--ac);
  transition: all 0.3s ease;
  letter-spacing: 0.5px;
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
  background: var(--ac2);
}
button:active { transform: translateY(0); }

/* Yeni Satıriçi Ekle Butonu */
button.add-btn {
  width: 36px;
  height: 36px;
  padding: 0;
  font-size: 24px;
  line-height: 1;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 12px;
}

button.ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--border);
}
button.ghost:hover {
  background: var(--card-hover);
  box-shadow: none;
  border-color: rgba(255,255,255,0.2);
}
button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.panel {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px;
  margin: 24px 0;
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0; width: 4px;
  background: var(--border);
  transition: 0.4s ease;
}
.panel.done {
  border-color: rgba(229, 9, 20, 0.3);
  background: rgba(229, 9, 20, 0.02);
}
.panel.done::before { background: var(--ac); }

.panel input.name {
  font-family: var(--font);
  font-size: 20px;
  font-weight: 600;
  background: transparent;
  border: none;
  border-bottom: 2px solid var(--border);
  color: var(--ink);
  padding: 8px 0;
  width: 160px;
  transition: 0.3s;
  border-radius: 0;
}
.panel input.name:focus {
  outline: none;
  border-color: var(--ac);
}
.top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
.top b { font-size: 18px; color: var(--mute); font-weight: 500;}

h3 {
  margin: 28px 0 12px;
  font-size: 14px;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
}
.chips { display: flex; flex-wrap: wrap; gap: 12px; }
.chip {
  background: transparent;
  color: var(--mute);
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 500;
  border: 1px solid var(--border);
}
.chip:hover {
  border-color: rgba(255,255,255,0.3);
  color: #fff;
  transform: none;
  box-shadow: none;
}
.chip.on {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
  font-weight: 600;
}
.chip small { opacity: 0.7; font-size: 11px; margin-left: 4px; }
.panel.done .chip, .panel.done input { pointer-events: none; opacity: 0.5; }

.center { text-align: center; margin-top: 40px; }
.meta { color: var(--mute); font-size: 14px; font-weight: 400; line-height: 1.6;}

.movie {
  background: var(--card);
  border-radius: var(--radius);
  padding: 40px;
  margin-top: 24px;
  text-align: center;
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
}
.movie img {
  width: 280px;
  max-width: 100%;
  border-radius: 12px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  margin-bottom: 24px;
  transition: transform 0.4s ease;
}
.movie img:hover { transform: scale(1.03); }
.pct {
  font-size: 56px;
  font-weight: 800;
  color: var(--ok);
  margin-bottom: 24px;
  text-shadow: 0 4px 20px rgba(70, 211, 105, 0.2);
}
.movie h2 { font-size: 32px; font-weight: 700; margin: 0 0 12px; letter-spacing: -0.5px;}
.ov {
  max-width: 650px;
  margin: 24px auto;
  line-height: 1.7;
  font-size: 16px;
  color: #ccc;
  font-weight: 300;
}
.eye {
  font-size: 24px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--ink);
  border-radius: 50%;
  width: 64px;
  height: 64px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.eye:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.2); }
.row { display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 32px; flex-wrap: wrap; }
.bd { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
.bd span {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 500;
}

.lib {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
  margin-top: 32px;
}
.lib .c {
  position: relative;
  background: transparent;
  border-radius: 12px;
  overflow: hidden;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 1px solid transparent;
}
.lib .c:hover {
  transform: translateY(-8px);
  z-index: 2;
  border-color: var(--border);
  background: var(--card);
  box-shadow: 0 15px 30px rgba(0,0,0,0.4);
}
.lib img { width: 100%; display: block; border-radius: 12px; transition: 0.3s;}
.lib .c:hover img { border-radius: 12px 12px 0 0; }
.lib p { margin: 12px; line-height: 1.5;}
.del {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 8px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  color: #fff;
  font-size: 14px;
  border-radius: 50%;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
}
.del:hover { background: #e50914; color: #fff; transform: none; box-shadow: none;}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20;
  padding: 20px;
}
.mbox {
  position: relative;
  background: #151515;
  border: 1px solid var(--border);
  border-radius: 20px;
  width: min(500px, 100%);
  padding: 32px;
  max-height: 90vh;
  overflow: auto;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}
.mbox .x {
  position: absolute;
  top: 16px;
  right: 16px;
  background: transparent;
  color: var(--mute);
  padding: 8px;
  font-size: 20px;
  border-radius: 50%;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
}
.mbox .x:hover { background: var(--card); color: #fff; transform: none; box-shadow: none;}
.mtop { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 32px;}
.mtop img { width: 120px; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.4);}
.mtop h2 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.5px;}
.rate {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}
.rate b { font-weight: 500; font-size: 15px;}
.star {
  font-style: normal;
  font-size: 32px;
  cursor: pointer;
  color: rgba(255,255,255,0.1);
  padding: 0 2px;
  transition: 0.2s;
}
.star:hover { transform: scale(1.1); }
.star.on { color: var(--ac); text-shadow: 0 0 15px rgba(229, 9, 20, 0.4);}
.hidden { display: none; }
.msg { padding: 60px 20px; color: var(--mute); text-align: center; font-size: 16px; font-weight: 300;}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>
    <span class="w-logo">W</span><span class="logo-rest">atchaWatchin</span>
  </h1>
  <div class="sp"></div>
  <button class="ghost" id="libBtn">Kitaplık</button>
</header>

<section id="setup">
  <div id="people"></div>
  <div class="center">
    <button id="goBtn" disabled style="font-size:18px;padding:16px 40px; border-radius: 99px;">Filmi Bul</button>
    <div class="meta" id="hint" style="margin-top:16px">Herkes seçimlerini "Onayla" ile kilitleyince buton açılır.</div>
  </div>
</section>

<section id="result" class="hidden"></section>
<section id="library" class="hidden"></section>
</div>

<script>
const KEY="76a997af0990e4ce134b6d965b1f7109", API="https://api.themoviedb.org/3", IMG="https://image.tmdb.org/t/p/w500";
const DUR={"Çerezlik":["<90 dk",0,89],"Standart":["90-120 dk",90,120],"Destansı":[">2 saat",121,999]};
const ERA={"Nostalji":["90'lar ve öncesi",null,1999],"Yakın Geçmiş":["2000-2015",2000,2015],"Yepyeni":["2020 ve sonrası",2020,null]};
const MOOD={"Beyin Yakan":[878,9648,53],"Kafa Boşaltmalık":[35,28,12,16],"Gerim Gerim Gerilmelik":[53,9648],"Battaniye & Kahve":[10749,10751,18],"Görsel Şölen":[14,878,12,16],"Mendil Hazırlatıcı":[18,10749],"İlham Verici":[18,36,10402],"Adrenalin Pompası":[28,12,53],"Gülmekten Karın Ağrıtan":[35],"Katil Kim?":[9648,80],"Karanlık ve Distopik":[878,53,27],"Gerçek Bir Hikayeden":[36,99],"Kan ve Dehşet":[27,53],"Gençlik Ateşi":[35,10749,18],"Animasyon":[16]};

let people=[], rank=[], idx=0, skipped=new Set();
const $=id=>document.getElementById(id);
const lib=()=>{try{return JSON.parse(localStorage.getItem("wwLib")||"[]")}catch(e){return[]}};

function addPerson(){
  people.push({name:"",dur:new Set(),era:new Set(),mood:new Set(),done:false});
  render();
}
function chips(p,i,type,obj){
  return Object.keys(obj).map(k=>{
    const sub=Array.isArray(obj[k])&&typeof obj[k][0]==="string"?` <small>${obj[k][0]}</small>`:"";
    return `<button class="chip ${p[type].has(k)?"on":""}" data-i="${i}" data-t="${type}" data-k="${k}">${k}${sub}</button>`}).join("");
}
function render(){
  $("people").innerHTML=people.map((p,i)=>`
  <div class="panel ${p.done?"done":""}">
    <div class="top"><b>Kişi ${i+1}</b>
      <input class="name" data-i="${i}" placeholder="İsim Girin" value="${p.name.replace(/"/g,"&quot;")}">
      <button class="add-btn" data-add="true" title="Yeni Kişi Ekle">+</button>
      <div class="sp"></div>
      ${people.length>1?`<button class="ghost" data-rm="${i}" title="Kişiyi sil" style="padding: 8px 16px; font-size: 13px;">Sil</button>`:""}
      <button data-ok="${i}" style="${p.done?"background:var(--card-hover);color:var(--mute); box-shadow:none; border: 1px solid var(--border);":""}">${p.done?"Düzenle":"Onayla"}</button>
    </div>
    <h3>Film Süresi</h3><div class="chips">${chips(p,i,"dur",DUR)}</div>
    <h3>Dönem</h3><div class="chips">${chips(p,i,"era",ERA)}</div>
    <h3>Mod ve Tema</h3><div class="chips">${chips(p,i,"mood",MOOD)}</div>
  </div>`).join("");
  const all=people.every(p=>p.done);
  $("goBtn").disabled=!all;
}

$("people").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.add!==undefined){
    addPerson();
    setTimeout(() => window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}), 50);
    return;
  }
  if(b.dataset.rm!==undefined){if(people.length>1){people.splice(+b.dataset.rm,1);render()}return}
  if(b.dataset.ok!==undefined){const p=people[+b.dataset.ok];p.done=!p.done;render();return}
  if(b.dataset.t){const s=people[+b.dataset.i][b.dataset.t];s.has(b.dataset.k)?s.delete(b.dataset.k):s.add(b.dataset.k);b.classList.toggle("on")}
});

$("people").addEventListener("input",e=>{if(e.target.classList.contains("name"))people[+e.target.dataset.i].name=e.target.value});

async function api(path,params={}){
  const u=new URL(API+path);u.searchParams.set("api_key",KEY);u.searchParams.set("language","tr-TR");
  for(const k in params)u.searchParams.set(k,params[k]);
  const r=await fetch(u);if(!r.ok)throw new Error("API hatası "+r.status);return r.json();
}
const yearOf=m=>m.release_date?+m.release_date.slice(0,4):null;
function eraOk(y,set){if(!set.size)return true;if(!y)return false;return [...set].some(k=>{const[,a,b]=ERA[k];return(a==null||y>=a)&&(b==null||y<=b)})}
function genreScore(g,set){if(!set.size)return 1;const want=new Set();set.forEach(k=>MOOD[k].forEach(x=>want.add(x)));
  let hit=0;set.forEach(k=>{if(MOOD[k].some(x=>g.includes(x)))hit++});return hit/set.size}
function durOk(rt,set){if(!set.size)return true;if(!rt)return false;return [...set].some(k=>rt>=DUR[k][1]&&rt<=DUR[k][2])}

async function findMovies(){
  $("setup").classList.add("hidden");$("result").classList.remove("hidden");
  $("result").innerHTML='<div class="msg">Herkesin zevki harmanlanıyor...</div>';
  try{
    const pool=new Map();
    for(const p of people){
      const genres=new Set();p.mood.forEach(k=>MOOD[k].forEach(x=>genres.add(x)));
      const eras=p.era.size?[...p.era]:[null];
      for(const e of eras){
        for(const pg of [1,2,3]){
          const q={sort_by:"vote_count.desc","vote_count.gte":500,page:pg,include_adult:false};
          if(genres.size)q.with_genres=[...genres].join("|");
          if(e){const[,a,b]=ERA[e];if(a)q["primary_release_date.gte"]=a+"-01-01";if(b)q["primary_release_date.lte"]=b+"-12-31"}
          if(p.dur.size===1){const[,a,b]=DUR[[...p.dur][0]];q["with_runtime.gte"]=a;if(b<999)q["with_runtime.lte"]=b}
          const d=await api("/discover/movie",q);
          d.results.forEach(m=>pool.set(m.id,m));
        }
      }
    }
    const seen=new Set(lib().map(m=>m.id));
    let cands=[...pool.values()].filter(m=>m.poster_path&&!seen.has(m.id));
    cands.forEach(m=>{const y=yearOf(m);m.pre=people.reduce((s,p)=>s+(eraOk(y,p.era)?1:0)+genreScore(m.genre_ids||[],p.mood),0)});
    cands.sort((a,b)=>b.pre-a.pre||b.vote_average-a.vote_average);
    cands=cands.slice(0,30);
    await Promise.all(cands.map(async m=>{try{m.runtime=(await api("/movie/"+m.id)).runtime}catch(e){}}));
    cands.forEach(m=>{
      const y=yearOf(m);m.per=people.map(p=>{
        const d=durOk(m.runtime,p.dur)?1:0,e=eraOk(y,p.era)?1:0,g=genreScore(m.genre_ids||[],p.mood);
        return Math.round((d+e+g)/3*100)});
      m.pct=Math.round(m.per.reduce((a,b)=>a+b,0)/m.per.length);
    });
    cands.sort((a,b)=>b.pct-a.pct||b.vote_average-a.vote_average);
    rank=cands;idx=0;skipped=new Set();showMovie();
  }catch(err){
    $("result").innerHTML=`<div class="msg">Hata: ${err.message}<br>İnternet bağlantınızı kontrol edin.<br><br><button id="back1">Geri dön</button></div>`;
    $("back1").onclick=backToSetup;
  }
}
function backToSetup(){$("result").classList.add("hidden");$("setup").classList.remove("hidden")}

function showMovie(){
  const m=rank[idx];
  if(!m){$("result").innerHTML='<div class="msg">Öneri listesi bitti. Seçimleri biraz esnetip tekrar deneyin.<br><br><button id="back2">Seçimlere dön</button></div>';
    $("back2").onclick=backToSetup;return}
  const names=people.map((p,i)=>esc(p.name.trim()||"Kişi "+(i+1)));
  $("result").innerHTML=`<div class="movie">
    <div class="meta" style="text-transform: uppercase; letter-spacing: 1px;">Ortak Eşleşme</div>
    <div class="pct">%${m.pct}</div>
    <img src="${IMG+m.poster_path}" alt="">
    <h2>${m.title}</h2>
    <div class="meta" style="font-weight: 500;">${(m.release_date||"").slice(0,4)} &nbsp;·&nbsp; ${m.runtime?m.runtime+" dk":"süre ?"} &nbsp;·&nbsp; ★ ${m.vote_average.toFixed(1)}</div>
    <div class="bd">${m.per.map((v,i)=>`<span>${names[i]}: %${v}</span>`).join("")}</div>
    <p class="ov">${m.overview||"Özet bulunamadı."}</p>
    <div class="row">
      <button class="eye" id="eyeBtn" title="İzledim / Pas geç">👁️</button>
      <button id="pickBtn" style="font-size:16px;padding:16px 36px; border-radius: 99px; background: var(--ok); color: #000; box-shadow: 0 4px 15px rgba(70, 211, 105, 0.4);">Bunu Seç</button>
    </div>
    <div class="meta" style="margin-top:24px; font-size: 12px; opacity: 0.6;">👁️ = İzledim ya da geç → sıradaki film</div>
    <div class="row" style="margin-top: 16px;"><button class="ghost" id="backBtn" style="border:none; text-decoration: underline;">Seçimleri değiştir</button></div>
  </div>`;
  $("eyeBtn").onclick=()=>{idx++;showMovie()};
  $("pickBtn").onclick=()=>pick(m);
  $("backBtn").onclick=backToSetup;
}
function pick(m){
  const l=lib();
  l.unshift({id:m.id,title:m.title,year:(m.release_date||"").slice(0,4),poster:m.poster_path,pct:m.pct,date:new Date().toLocaleDateString("tr-TR"),group:people.map((p,i)=>p.name.trim()||"Kişi "+(i+1)),ratings:{}});
  try{localStorage.setItem("wwLib",JSON.stringify(l))}catch(e){}
  $("result").innerHTML=`<div class="movie"><div style="font-size:64px; margin-bottom: 24px;">🍿</div><h2>İyi Seyirler!</h2><p class="meta" style="margin-bottom: 40px;">"${m.title}" Kitaplığa kaydedildi.</p>
  <div class="row"><button id="libGo" style="border-radius: 99px;">Kitaplığı Gör</button><button class="ghost" id="newGo" style="border-radius: 99px;">Yeni Seçim Yap</button></div></div>`;
  $("libGo").onclick=showLib;
  $("newGo").onclick=()=>{$("result").classList.add("hidden");$("setup").classList.remove("hidden")};
}
function showLib(){
  $("setup").classList.add("hidden");$("result").classList.add("hidden");$("library").classList.remove("hidden");
  const l=lib();
  $("library").innerHTML=`<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;"><h2 style="margin:0; font-weight: 700;">Kitaplık</h2><button class="ghost" id="closeLib" style="border:none; text-decoration:underline; padding:0;">Geri Dön</button></div>`+
   (l.length?`<div class="meta" style="margin-bottom:24px">Puan vermek için filme tıklayın.</div><div class="lib">${l.map(m=>{const r=Object.values(m.ratings||{}).filter(x=>x>0);const avg=r.length?(r.reduce((x,y)=>x+y,0)/r.length).toFixed(1):"";return `<div class="c" data-id="${m.id}"><button class="del" data-del="${m.id}" title="Sil">✕</button><img src="${IMG+m.poster}" alt=""><p><b style="font-size: 15px;">${esc(m.title)}</b><br><span class="meta" style="font-size: 12px;">${m.year} &nbsp;·&nbsp; ${m.date}<br><span style="color: var(--mute); opacity: 0.8; margin-top: 4px; display: block;">${esc(groupArr(m).join(", "))}</span>${avg?`<span style="color: var(--ac); font-weight: 600; margin-top:4px; display:block;">★ ${avg}</span>`:""}</span></p></div>`}).join("")}</div>`:'<div class="msg">Henüz izlenen film yok.</div>');
  $("closeLib").onclick=()=>{$("library").classList.add("hidden");$("setup").classList.remove("hidden")};
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const groupArr=m=>Array.isArray(m.group)?m.group:String(m.group||"").split(", ").filter(Boolean);
const saveLib=l=>{try{localStorage.setItem("wwLib",JSON.stringify(l))}catch(e){}};
function openModal(id){
  const l=lib(),m=l.find(x=>x.id==id);if(!m)return;
  const names=groupArr(m),r=m.ratings||{};
  let el=$("modal");if(!el){el=document.createElement("div");el.id="modal";el.className="modal";document.body.appendChild(el)}
  el.innerHTML=`<div class="mbox"><button class="x" id="mx">✕</button>
   <div class="mtop"><img src="${IMG+m.poster}" alt=""><div><h2>${esc(m.title)}</h2><div class="meta" style="line-height:1.8;">${m.year} <br> ${m.date} <br> <span style="color:var(--ac); font-weight: 600;">%${m.pct} Eşleşme</span></div></div></div>
   <h3 style="margin-top: 0; padding-top: 16px; border-top: 1px solid var(--border);">Puanlar</h3>${names.map((n,i)=>`<div class="rate"><b>${esc(n)}</b><span>${[1,2,3,4,5].map(x=>`<i class="star ${(r[n]||0)>=x?"on":""}" data-p="${i}" data-s="${x}">★</i>`).join("")}</span></div>`).join("")||'<div class="msg">Kişi bilgisi yok.</div>'}</div>`;
  el.style.display="flex";
  el.onclick=e=>{
    if(e.target===el||e.target.id==="mx"){el.style.display="none";return}
    const st=e.target.closest(".star");if(!st)return;
    const all=lib(),mm=all.find(x=>x.id==id);mm.ratings=mm.ratings||{};
    const n=names[+st.dataset.p],v=+st.dataset.s;
    mm.ratings[n]=mm.ratings[n]===v?0:v;saveLib(all);openModal(id);showLib();
  };
}
$("library").addEventListener("click",e=>{
  const d=e.target.closest("[data-del]");
  if(d){e.stopPropagation();if(confirm("Film kitaplıktan silinsin mi?")){saveLib(lib().filter(x=>x.id!=d.dataset.del));showLib()}return}
  const c=e.target.closest(".c");if(c)openModal(c.dataset.id);
});
$("libBtn").onclick=showLib;
$("goBtn").onclick=findMovies;

// Başlangıçta 1 kişi eklensin
addPerson();
</script>
</body>
</html>
